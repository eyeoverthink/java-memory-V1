plugins {
    id 'java'
    id 'application'
}
version = '2.0'
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
sourceSets {
    main {
        java {
            // Exclude Processing-dependent visualization files
            exclude '**/sim/UniverseModel.java'
            // Exclude incomplete LLM engine files with compilation errors
            exclude '**/llm/LlamaEngine.java'
            exclude '**/llm/InferenceCore.java'
            exclude '**/llm/ModelLoader.java'
            exclude '**/llm/NativeBridge.java'
            // Exclude old ollama implementations (replaced by fraymus-ai-core library)
            exclude '**/ollama/RagEngine.java'
            exclude '**/ollama/ToolRouter.java'
            exclude '**/ollama/UniversalMain.java'
            exclude '**/ollama/UniversalSystemMain.java'
            exclude '**/ollama/VectorVault.java'
            
            // Exclude files that depend on missing io.fraymus.ai package
            exclude '**/ai/FraymusPhysicsReflector.java'
            exclude '**/examples/FraymusAIExample.java'
            exclude '**/examples/QuantumSupremacyDemo.java'
            exclude '**/examples/RealPhysicsDemo.java'
            exclude '**/examples/ReflectorExample.java'
            // FraynixBoot.java rewritten — no longer depends on io.fraymus.ai
            // exclude '**/FraynixBoot.java'
            exclude '**/FraymusSystem.java'
        }
    }
}
def osName = System.getProperty('os.name').toLowerCase()
def lwjglNativesValue = osName.contains('win') ? 'natives-windows' :
        (osName.contains('mac') ? 'natives-macos' : 'natives-linux')
def imguiNativesSuffix = osName.contains('win') ? 'windows' :
        (osName.contains('mac') ? 'macos' : 'linux')
repositories {
    mavenLocal {
        content {
            includeGroupByRegex 'org\\.junit.*'
            includeGroup 'org.opentest4j'
            includeGroup 'org.apiguardian'
        }
    }
    mavenCentral()
}
project.ext.lwjglVersion = "3.3.3"
project.ext.jomlVersion = "1.10.5"
project.ext.lwjglNatives = lwjglNativesValue
project.ext.imguiVersion = "1.86.11"
dependencies {
    implementation project(':factory-runtime')
    implementation project(':factory-kernel')
    // Jsoup for web scraping (ParietalLobeBrain)
    implementation 'org.jsoup:jsoup:1.17.2'

    // JSON processing
    implementation 'org.json:json:20231013'
    
    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'ch.qos.logback:logback-classic:1.4.11'
    
    // Email (for NeuralCourier)
    implementation 'com.sun.mail:javax.mail:1.6.2'
    implementation "io.github.spair:imgui-java-binding:$imguiVersion"
    implementation "io.github.spair:imgui-java-lwjgl3:$imguiVersion"
    runtimeOnly "io.github.spair:imgui-java-natives-${imguiNativesSuffix}:$imguiVersion"
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-opengl"
    implementation "org.lwjgl:lwjgl-stb"
    runtimeOnly "org.lwjgl:lwjgl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-opengl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-stb::$lwjglNatives"
    implementation "org.joml:joml:$jomlVersion"
    implementation "org.apache.pdfbox:pdfbox:3.0.3"
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.java-websocket:Java-WebSocket:1.5.7'
    
    // MongoDB for immediate persistence
    implementation "org.mongodb:mongodb-driver-sync:4.11.1"
    
    // WebSocket for live HTML arena visualization
    implementation "org.json:json:20230227"
    
    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
    
    // Fraynix Nexus Omega for real LLM integration
}

tasks.register('runFactoryDemo', JavaExec) {
    group = 'application'
    description = 'Run the shared headless entity/component and Fraynix integration demo'
    dependsOn ':factory-kernel:classes'
    classpath = project(':factory-kernel').sourceSets.main.runtimeClasspath
    mainClass = 'fraymus.factory.kernel.FactoryDemo'
    if (project.hasProperty('factoryWorkspace')) { args = [project.property('factoryWorkspace')] }
}
test {
    useJUnitPlatform()
    testLogging {
        events "passed", "failed", "skipped"
        showStandardStreams = false
    }
}

sourceSets {
    kernelCommandTest {
        java.srcDir 'src/kernelCommandTest/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    kernelCommandTestImplementation.extendsFrom testImplementation, implementation
    kernelCommandTestRuntimeOnly.extendsFrom testRuntimeOnly, runtimeOnly
}
tasks.register('kernelCommandTest', Test) {
    dependsOn classes
    testClassesDirs = sourceSets.kernelCommandTest.output.classesDirs
    classpath = sourceSets.kernelCommandTest.runtimeClasspath
    useJUnitPlatform()
    testLogging { events 'passed', 'failed', 'skipped' }
}
sourceSets {
    mediaTest {
        java.srcDir 'src/mediaTest/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    localModelTest {
        java {
            srcDir 'src/test/java'
            include 'fraymus/OllamaIntegrationTest.java'
            include 'fraymus/llm/LocalModelCatalogTest.java'
            include 'fraymus/llm/ModelAbstractionLayerTest.java'
            include 'fraymus/core/OllamaBridgeModelResolutionTest.java'
            include 'fraymus/brain/unified/UnifiedBrainOrchestratorModelRegistryIntegrationTest.java'
        }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    mediaTestImplementation.extendsFrom testImplementation
    mediaTestRuntimeOnly.extendsFrom testRuntimeOnly
    localModelTestImplementation.extendsFrom testImplementation
    localModelTestRuntimeOnly.extendsFrom testRuntimeOnly
}
tasks.register('verifyLocalModels', Test) {
    group = 'verification'
    description = 'Verify local-only model selection, catalog integration, and Ollama response handling'
    testClassesDirs = sourceSets.localModelTest.output.classesDirs
    classpath = sourceSets.localModelTest.runtimeClasspath
    useJUnitPlatform()
    testLogging { events 'passed', 'failed', 'skipped' }
}
tasks.register('verifyMediaOutput', Test) {
    group = 'verification'
    testClassesDirs = sourceSets.mediaTest.output.classesDirs
    classpath = sourceSets.mediaTest.runtimeClasspath
    useJUnitPlatform()
    testLogging { events 'passed', 'failed', 'skipped' }
}
tasks.register('runMediaOutput', JavaExec) {
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'fraymus.media.MediaOutputCli'
    systemProperties System.getProperties().findAll { k, v -> k.startsWith('fraynix.media.') || k == 'fraynix.models' }
}
tasks.register('proveMediaDream', JavaExec) {
    classpath = sourceSets.mediaTest.runtimeClasspath
    mainClass = 'fraymus.media.MediaDreamProof'
    systemProperties System.getProperties().findAll { k, v -> k.startsWith('fraynix.media.') || k == 'fraynix.models' }
}
tasks.register('writeMediaRuntimeClasspath') {
    doLast { file('build/media-runtime-classpath.txt').text = sourceSets.main.runtimeClasspath.asPath }
}
application {
    mainClass = 'fraymus.FraymusApp'
}
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}
jar {
    manifest {
        attributes 'Main-Class': 'fraymus.FraymusApp'
    }
}
run {
    jvmArgs = ['-Djava.awt.headless=false']
    workingDir = projectDir
    
    // Allow overriding main class via property
    if (project.hasProperty('mainClass')) {
        mainClass = project.property('mainClass')
    }
}
