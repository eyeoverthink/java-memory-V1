sourceSets {
    specialistTest {
        java {
            srcDir 'src/test/java'
            include 'fraymus/genomics/**'
        }
        compileClasspath += sourceSets.main.output + configurations.runtimeClasspath
        runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
    }
}

tasks.register('writeSpecialistTestClasspath') {
    dependsOn tasks.named('compileJava'), tasks.named('compileSpecialistTestJava')
    doLast {
        def target = layout.buildDirectory.file('specialist-tests/classpath.txt').get().asFile
        target.parentFile.mkdirs()
        target.text = sourceSets.specialistTest.runtimeClasspath.asPath
    }
}
