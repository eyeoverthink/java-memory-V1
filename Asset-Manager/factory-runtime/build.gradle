plugins { id 'java-library' }
group = 'ai.fraymus'
version = '0.1.0'
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
// This JDK-only module uses an executable test harness rather than a JUnit dependency.
tasks.named('test') { enabled = false }
tasks.register('verifyRuntime', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'fraymus.factory.FactoryRuntimeTest'
}
tasks.named('check') { dependsOn 'verifyRuntime' }
tasks.register('verifyTransactions', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'fraymus.factory.WorldTransactionTest'
}
tasks.named('verifyRuntime') { finalizedBy 'verifyTransactions' }
